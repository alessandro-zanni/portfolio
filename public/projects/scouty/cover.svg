<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7cc4ef" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#a9dffb" />
  <rect width="1600" height="1000" fill="url(#grid)" />

  <!-- signature brick mark -->
  <g transform="translate(1370,60) scale(1.5)">
    <path d="M9 33 L50 54 L50 88 L9 67 Z" fill="#a81f1b" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <path d="M91 33 L50 54 L50 88 L91 67 Z" fill="#e02b26" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <path d="M50 12 L91 33 L50 54 L9 33 Z" fill="#ec6a63" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <ellipse cx="34" cy="27" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="52" cy="18" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="48" cy="39" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="66" cy="30" rx="7" ry="4" fill="#ec6a63" />
  </g>

  <!-- scouting report clipboard -->
  <g transform="translate(560,190)">
    <rect x="0" y="0" width="480" height="480" fill="#ffffff" stroke="#10100f" stroke-width="6" />
    <rect x="0" y="0" width="480" height="90" fill="#10100f" />
    <rect x="40" y="-24" width="24" height="60" fill="#10100f" />
    <rect x="416" y="-24" width="24" height="60" fill="#10100f" />
    <rect x="36" y="34" width="200" height="18" fill="#ffffff" />
    <rect x="36" y="60" width="130" height="10" fill="#a6adb3" />

    <!-- radar axes -->
    <g stroke="#a6adb3" stroke-width="3">
      <line x1="240" y1="300" x2="240" y2="130" />
      <line x1="240" y1="300" x2="401.7" y2="247.5" />
      <line x1="240" y1="300" x2="340" y2="437.5" />
      <line x1="240" y1="300" x2="140" y2="437.5" />
      <line x1="240" y1="300" x2="78.3" y2="247.5" />
    </g>
    <polygon points="240,130 401.7,247.5 340,437.5 140,437.5 78.3,247.5" fill="none" stroke="#a6adb3" stroke-width="4" />

    <!-- scored shape -->
    <polygon points="240,155.5 328.9,271.1 310,396.3 150.1,423.8 143,268.5"
      fill="#1a7a3c" fill-opacity="0.35" stroke="#1a7a3c" stroke-width="6" stroke-linejoin="round" />
    <circle cx="240" cy="155.5" r="7" fill="#10100f" />
    <circle cx="328.9" cy="271.1" r="7" fill="#10100f" />
    <circle cx="310" cy="396.3" r="7" fill="#10100f" />
    <circle cx="150.1" cy="423.8" r="7" fill="#10100f" />
    <circle cx="143" cy="268.5" r="7" fill="#10100f" />

    <!-- priority tag -->
    <rect x="36" y="446" width="150" height="20" fill="#a81f1b" />

    <!-- football badge -->
    <g transform="translate(300,-40)">
      <circle cx="45" cy="45" r="45" fill="#ffffff" stroke="#10100f" stroke-width="6" />
      <path d="M45 20 L61 32 L55 51 L35 51 L29 32 Z" fill="#10100f" />
    </g>
  </g>
</svg>
