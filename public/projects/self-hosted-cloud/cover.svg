<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7cc4ef" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#a9dffb" />
  <rect width="1600" height="1000" fill="url(#grid)" />

  <!-- signature brick mark -->
  <g transform="translate(1370,60) scale(1.5)">
    <path d="M9 33 L50 54 L50 88 L9 67 Z" fill="#a81f1b" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <path d="M91 33 L50 54 L50 88 L91 67 Z" fill="#e02b26" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <path d="M50 12 L91 33 L50 54 L9 33 Z" fill="#ec6a63" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <ellipse cx="34" cy="27" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="52" cy="18" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="48" cy="39" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="66" cy="30" rx="7" ry="4" fill="#ec6a63" />
  </g>

  <!-- server rack -->
  <g transform="translate(590,150)">
    <rect x="0" y="0" width="420" height="620" fill="#ffffff" stroke="#10100f" stroke-width="6" />
    <g stroke="#10100f" stroke-width="4">
      <line x1="0" y1="124" x2="420" y2="124" />
      <line x1="0" y1="248" x2="420" y2="248" />
      <line x1="0" y1="372" x2="420" y2="372" />
      <line x1="0" y1="496" x2="420" y2="496" />
    </g>
    <!-- status lights, one per unit -->
    <g fill="#0f6fc4" stroke="#10100f" stroke-width="3">
      <rect x="30" y="46" width="26" height="26" />
      <rect x="72" y="46" width="26" height="26" fill="#f5c000" />
      <rect x="30" y="170" width="26" height="26" />
      <rect x="72" y="170" width="26" height="26" />
      <rect x="30" y="294" width="26" height="26" fill="#f5c000" />
      <rect x="72" y="294" width="26" height="26" />
      <rect x="30" y="418" width="26" height="26" />
      <rect x="72" y="418" width="26" height="26" />
      <rect x="30" y="542" width="26" height="26" />
      <rect x="72" y="542" width="26" height="26" fill="#f5c000" />
    </g>
    <g stroke="#a6adb3" stroke-width="6">
      <line x1="170" y1="46" x2="360" y2="46" />
      <line x1="170" y1="170" x2="360" y2="170" />
      <line x1="170" y1="294" x2="360" y2="294" />
      <line x1="170" y1="418" x2="360" y2="418" />
      <line x1="170" y1="542" x2="360" y2="542" />
    </g>
  </g>
</svg>
