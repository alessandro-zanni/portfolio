<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7cc4ef" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#a9dffb" />
  <rect width="1600" height="1000" fill="url(#grid)" />

  <!-- signature brick mark -->
  <g transform="translate(1370,60) scale(1.5)">
    <path d="M9 33 L50 54 L50 88 L9 67 Z" fill="#a81f1b" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <path d="M91 33 L50 54 L50 88 L91 67 Z" fill="#e02b26" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <path d="M50 12 L91 33 L50 54 L9 33 Z" fill="#ec6a63" stroke="#10100f" stroke-width="3" stroke-linejoin="round" />
    <ellipse cx="34" cy="27" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="52" cy="18" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="48" cy="39" rx="7" ry="4" fill="#ec6a63" />
    <ellipse cx="66" cy="30" rx="7" ry="4" fill="#ec6a63" />
  </g>

  <!-- three fanned browser windows: multiple client sites -->
  <g transform="translate(430,540)">
    <g transform="rotate(-10)">
      <rect x="0" y="0" width="420" height="280" fill="#d7dbde" stroke="#10100f" stroke-width="6" />
      <rect x="0" y="0" width="420" height="52" fill="#a6adb3" stroke="#10100f" stroke-width="6" />
      <circle cx="26" cy="26" r="7" fill="#10100f" />
      <circle cx="50" cy="26" r="7" fill="#10100f" />
      <circle cx="74" cy="26" r="7" fill="#10100f" />
    </g>
  </g>
  <g transform="translate(560,470)">
    <g transform="rotate(3)">
      <rect x="0" y="0" width="420" height="280" fill="#eef0f1" stroke="#10100f" stroke-width="6" />
      <rect x="0" y="0" width="420" height="52" fill="#0f6fc4" stroke="#10100f" stroke-width="6" />
      <circle cx="26" cy="26" r="7" fill="#ffffff" />
      <circle cx="50" cy="26" r="7" fill="#ffffff" />
      <circle cx="74" cy="26" r="7" fill="#ffffff" />
      <rect x="30" y="90" width="220" height="14" fill="#a6adb3" />
      <rect x="30" y="122" width="280" height="14" fill="#a6adb3" />
      <rect x="30" y="154" width="160" height="14" fill="#a6adb3" />
      <rect x="30" y="200" width="130" height="40" fill="#f5c000" stroke="#10100f" stroke-width="5" />
    </g>
  </g>
</svg>
