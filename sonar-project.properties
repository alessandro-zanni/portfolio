# SonarQube — analisi statica locale. Vedi AGENTS.md ("Static analysis (SonarQube)").
# Server: istanza condivisa in ~/projects/sonarqube (Docker, non in CI).
# Il token NON va qui: arriva da SONAR_TOKEN (env), letto in automatico dallo scanner.

sonar.projectKey=portfolio
sonar.projectName=Portfolio
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=app,components,lib,hooks,mdx-components.tsx
# primitive shadcn generate / contenuti MDX (testo, non codice) / build
sonar.exclusions=components/ui/**,content/**,.next/**,public/**,**/*.config.*

# Nessun test: la copertura non si misura (altrimenti il gate fallisce sempre sul codice nuovo).
sonar.coverage.exclusions=**/*
